server:
  host: 0.0.0.0
  port: 9488

logging:
  level: INFO
  file: logs/app.log
  max_bytes: 5242880
  backup_count: 5

data:
  dir: data
  db_file: data/trade_plat.db
  index_cache_ttl_minutes: 30
  history_days: 1260

longbridge:
  # Official limit: 10 calls per second per connection. Stay comfortably under it.
  requests_per_second: 6
  burst: 6
  max_retries: 6
  base_backoff_seconds: 2
  max_backoff_seconds: 60
  rate_limit_error_codes: [301606, 429002, 429]
  # Longbridge also caps how many option contracts may be quoted per minute (error 301607, "Too many option
  # securities request within one minute"): 400 in a minute passed, 600 failed, and the count resets on the
  # calendar minute. We track a rolling 60s window, which is never more permissive than the server's bucket.
  option_contracts_per_minute: 500
  option_quote_batch_size: 100   # API max is 500 symbols per call; kept small so a batch never blows the minute budget
  depth_top_n: 12                # candidates per underlying enriched with bid/ask (1 call each)
  max_expiries_per_symbol: 3     # scenario expiries per underlying (1 chain call + quotes each)
  max_strikes_per_expiry: 30     # strikes quoted per expiry after thinning
  reference_strike_band: [0.85, 1.03]   # strikes sampled on the ~30 DTE expiry for ATM IV / skew
  strike_band: [0.60, 1.00]      # fallback band when ATM IV is unknown

watchlist:
  default: ["SOXL", "TECL", "KORU", "GOOGL", "MSFT", "AAPL", "AMZN", "SPY", "QQQ", "IWM"]   # US tickers; ".US" is added automatically

indices:
  # Volatility-complex mini charts: CBOE index names (cdn.cboe.com/.../<NAME>_History.csv) or
  # {key, label, sources} entries for other providers.
  charts:
    - VIX1D
    - VIX9D
    - VIX3M
    - VVIX
    - DSPX
    - COR3M
    - key: MOVE
      label: ICE BofA MOVE - Treasury implied volatility (daily, via Yahoo ^MOVE)
      sources: [{type: yahoo, symbol: "^MOVE", label: "Yahoo ^MOVE"}]
  # ETFs whose 30-day IV is published as a CBOE index: used as the IV-rank source for those tickers.
  iv_rank_proxies:
    SPY: VIX
    QQQ: VXN
    IWM: RVX
    DIA: VXD
    GLD: GVZ
    USO: OVX
    EEM: VXEEM
    EFA: VXEFA
    SLV: VXSLV
    TLT: VXTLT

thresholds:
  vix:                    # < low = LOW, < medium = MEDIUM, < high = HIGH, else VERY_HIGH
    low: 16
    medium: 22
    high: 30
  iv_rank:                # 0-100 over lookback; < low = LOW, < medium = MEDIUM, < high = HIGH, else EXTREME
    low: 25
    medium: 50
    high: 75
    lookback_days: 252
  skew:                   # CBOE SKEW index; < low = LOW, < normal = NORMAL, < high = HIGH, else EXTREME
    low: 125
    normal: 140
    high: 150
    lookback_days: 252
  panic_reversal:
    peak_lookback_days: 15
    min_peak: 30
    min_drop_from_peak_pct: 15
    falling_lookback_days: 5

analytics:
  risk_free_rate: 0.03     # fallback when no rate_curve tenor can be loaded
  rate_curve:              # Treasury yields by tenor, interpolated on each contract's DTE (flat beyond the ends)
    - {dte: 91, sources: [{type: fred, id: DGS3MO}, {type: yahoo, symbol: "^IRX", range: 1mo}]}
    - {dte: 365, sources: [{type: fred, id: DGS1}]}
    - {dte: 730, sources: [{type: fred, id: DGS2}]}
  dividend_yield: 0.012    # fallback when a symbol's trailing 12-month dividends cannot be fetched
  dividend_yields: {}      # per-ticker overrides, e.g. {SPY: 0.011}; otherwise trailing 12-month dividends / price
  margin:                  # naked short put requirement per share on top of the premium (Reg-T style approximation):
    spot_pct: 0.20         #   max(spot_pct * spot - out-of-the-money amount, strike_pct * strike), capped at the strike
    strike_pct: 0.10
    leverage: {SOXL: 3, TECL: 3, KORU: 3}   # leveraged ETFs: both percentages scale with the fund's leverage
  reference_dte: 30        # expiry used for ATM IV and chain skew metrics
  skew_delta: 0.25         # chain put skew = IV(25-delta put) / IV(ATM)
  chain_skew_ratio:        # < low = LOW, < normal = NORMAL, < high = HIGH, else EXTREME
    low: 1.08
    normal: 1.20
    high: 1.35
  min_snapshots_for_iv_rank: 20        # partial per-stock IV rank from our own daily ATM-IV snapshots
  min_snapshots_for_full_iv_rank: 120  # snapshots preferred over the LEAPS proxy once this many exist

iv_backfill:
  # Per-stock IV history rebuilt from a long-dated expiry's daily option closes (Black-Scholes inverted at the
  # strikes bracketing each day's close). One candlestick call per strike, counted against the option budget.
  max_strikes: 14
  days: 270
  min_dte: 60
  max_dte: 400
  min_points: 60           # fewer points than this is reported as a partial proxy
  max_expiry_attempts: 2   # thin chains: try the next candidate expiry when the first has too little history

iv_snapshot:
  enabled: true
  daily_at_et: "16:20"     # weekday refresh of the default watchlist after the US close
  max_attempts: 3          # symbols still missing a snapshot are retried, then an alert is raised
  retry_minutes: 15

alerts:
  # Alerts are always logged at ERROR. Email needs TRADE_PLAT_SMTP_USER / TRADE_PLAT_SMTP_PASSWORD in .env.
  email_enabled: true

macro:
  live_ttl_seconds: 55     # intraday bars / last price are re-fetched at most this often per series
  default_range: 1d        # 1d, 5d (intraday) or 1m, 3m, 6m, 1y, 3y, 5y (daily)
  max_symbols_per_section: 12   # cap on user-added tickers in a `symbols` section (2 Longbridge calls each per refresh)

kalshi:
  enabled: true
  refresh_seconds: 30
  charts:
    - id: next
      title: Fed decision odds (Kalshi)
      series_ticker: KXFEDDECISION
      event: next
      markets: []
    - id: december_hikes
      title: December Fed hike odds (Kalshi)
      series_ticker: KXFEDDECISION
      event: december
      markets: [hike]

# Live chart sections (3 charts per row, timeframe buttons, minute-by-minute refresh, crosshair).
# Per series: `sources` = daily history, `live` = intraday bars + last price; both are tried in order and the
# one that worked is shown in the UI. Series without `live` are daily-only.
# A section with `symbols` instead of `series` charts plain tickers (Longbridge, Yahoo fallback); the list here is
# the default and the UI lets the user add/remove tickers (kept per browser).
live_sections:
  # Hidden section: feeds the VIX card (live Longbridge index quote + intraday bars on top of the CBOE history).
  - id: vix
    title: CBOE VIX
    hidden: true
    refresh_seconds: 5
    series:
      - key: VIX
        label: CBOE VIX (live via Longbridge .VIX.US)
        unit: index
        sources: [{type: cboe, name: VIX}, {type: fred, id: VIXCLS}]
        live: [{type: longbridge, symbol: .VIX.US}]
  - id: stocks
    title: Stocks & Leveraged ETFs
    chart_mode: percent_change
    refresh_seconds: 15    # page poll; live_ttl_seconds lets Longbridge bars/quotes refresh that often too
    live_ttl_seconds: 15
    symbols: [SOXL, TECL, UPRO, SPXL]   # US tickers; ".US" is added automatically
  - id: comparisons
    tab: macro
    title: Market Comparisons
    daily_only: true
    default_range: 1y
    ranges: [1m, 3m, 6m, 1y, 3y, 5y]
    refresh_seconds: 1800
    groups:
      - id: smh_kospi
        title: SMH ETF / KOSPI
        mode: price_change
        series: [SMH, KOSPI]
        note: "Local-currency price changes, not FX-adjusted or dividend-inclusive returns. Same-date Seoul and New York closes are not simultaneous."
      - id: kospi_gold
        title: KOSPI / Gold (XAU)
        mode: price_change
        series: [KOSPI, XAU]
        note: "KOSPI closes in KRW versus London spot gold in USD, normalized to a shared baseline date. Seoul closes and London gold fixings are not simultaneous and FX is not adjusted."
      - id: rates_fed
        title: Treasury yields / Fed policy
        mode: rate_level
        series: [US2Y, US10Y, DFF, DFEDTARL, DFEDTARU]
        target_bounds: [DFEDTARL, DFEDTARU]
        note: "Actual percentage levels. Effective federal funds is an observed rate, not the target midpoint. Changes are in basis points."
    series:
      - key: SMH
        label: SMH ETF
        unit: usd
        timezone: America/New_York
        sources: [{type: yahoo, symbol: SMH, timezone: America/New_York}]
      - key: KOSPI
        label: KOSPI
        unit: index
        timezone: Asia/Seoul
        sources: [{type: yahoo, symbol: "^KS11", timezone: Asia/Seoul}]
      - key: XAU
        label: Gold spot XAU/USD
        unit: usd
        sources: [{type: sina, symbol: XAU, label: "Sina spot gold"}, {type: yahoo, symbol: "GC=F", label: "Gold futures (history fallback)"}]
      - key: US2Y
        label: US 2-year Treasury
        unit: pct
        sources: [{type: fred, id: DGS2}]
      - key: US10Y
        label: US 10-year Treasury
        unit: pct
        sources: [{type: fred, id: DGS10}]
      - key: DFF
        label: Effective federal funds
        unit: pct
        sources: [{type: fred, id: DFF}]
      - key: DFEDTARL
        label: Fed target lower
        unit: pct
        sources: [{type: fred, id: DFEDTARL}]
      - key: DFEDTARU
        label: Fed target upper
        unit: pct
        sources: [{type: fred, id: DFEDTARU}]
  - id: futures_basis
    tab: macro
    title: Spot-Futures Basis
    daily_only: true
    default_range: 1y
    ranges: [1m, 3m, 6m, 1y, 3y]
    refresh_seconds: 1800
    series:
      - key: NDX_BASIS
        label: Nasdaq-100 futures minus spot (index points)
        unit: index
        note: "Front-month E-mini Nasdaq-100 (NQ=F) close minus the cash index (^NDX). The two closes are an hour apart, so the gap includes the final hour of trading; no roll or dividend adjustment."
        sources:
          - type: derived_basis
            metric: gap
            label: "NQ=F - ^NDX"
            futures: {type: yahoo, symbol: "NQ=F"}
            spot: {type: yahoo, symbol: "^NDX"}
      - key: NDX_CARRY
        label: Nasdaq-100 annualized futures basis (%)
        unit: pct
        note: "NQ=F / ^NDX - 1, annualized to the next quarterly expiry (third Friday of Mar/Jun/Sep/Dec), with days to expiry floored at 7 around rolls. The jump around roll dates is expected; there is no dividend or financing adjustment."
        sources:
          - type: derived_basis
            metric: annualized
            expiry: third_friday
            label: "NQ=F vs ^NDX annualized"
            futures: {type: yahoo, symbol: "NQ=F"}
            spot: {type: yahoo, symbol: "^NDX"}
      - key: SPX_BASIS
        label: S&P 500 futures minus spot (index points)
        unit: index
        note: "Front-month E-mini S&P 500 (ES=F) close minus the cash index (^GSPC). The two closes are an hour apart, so the gap includes the final hour of trading; no roll or dividend adjustment."
        sources:
          - type: derived_basis
            metric: gap
            label: "ES=F - ^GSPC"
            futures: {type: yahoo, symbol: "ES=F"}
            spot: {type: yahoo, symbol: "^GSPC"}
      - key: SPX_CARRY
        label: S&P 500 annualized futures basis (%)
        unit: pct
        note: "ES=F / ^GSPC - 1, annualized to the next quarterly expiry (third Friday of Mar/Jun/Sep/Dec), with days to expiry floored at 7 around rolls. The jump around roll dates is expected; there is no dividend or financing adjustment."
        sources:
          - type: derived_basis
            metric: annualized
            expiry: third_friday
            label: "ES=F vs ^GSPC annualized"
            futures: {type: yahoo, symbol: "ES=F"}
            spot: {type: yahoo, symbol: "^GSPC"}
      - key: BTC_BASIS
        label: Bitcoin futures minus spot (USD)
        unit: usd
        note: "CME front-month Bitcoin futures (BTC=F) close minus spot (BTC-USD). Crypto trades around the clock, so the two prices are close but not simultaneous."
        sources:
          - type: derived_basis
            metric: gap
            label: "BTC=F - BTC-USD"
            futures: {type: yahoo, symbol: "BTC=F"}
            spot: {type: yahoo, symbol: "BTC-USD"}
      - key: BTC_CARRY
        label: Bitcoin annualized futures basis (%)
        unit: pct
        note: "BTC=F / BTC-USD - 1, annualized to the last-Friday monthly expiry, with days to expiry floored at 7 around rolls. The jump around roll dates is expected."
        sources:
          - type: derived_basis
            metric: annualized
            expiry: last_friday
            label: "BTC=F vs BTC-USD annualized"
            futures: {type: yahoo, symbol: "BTC=F"}
            spot: {type: yahoo, symbol: "BTC-USD"}
  - id: global_equities
    tab: macro
    title: Global Equity Indices
    chart_mode: percent_change
    series:
      - key: DAX
        label: DAX
        unit: index
        timezone: Europe/Berlin
        sources: [{type: yahoo, symbol: "^GDAXI", timezone: Europe/Berlin}]
        live: [{type: yahoo, symbol: "^GDAXI", timezone: Europe/Berlin}]
      - key: FTSE100
        label: FTSE 100
        unit: index
        timezone: Europe/London
        sources: [{type: yahoo, symbol: "^FTSE", timezone: Europe/London}]
        live: [{type: yahoo, symbol: "^FTSE", timezone: Europe/London}]
      - key: NIKKEI225
        label: Nikkei 225
        unit: index
        timezone: Asia/Tokyo
        sources: [{type: yahoo, symbol: "^N225", timezone: Asia/Tokyo}]
        live: [{type: yahoo, symbol: "^N225", timezone: Asia/Tokyo}]
      - key: TAIEX
        label: Taiwan TAIEX
        unit: index
        timezone: Asia/Taipei
        sources: [{type: yahoo, symbol: "^TWII", timezone: Asia/Taipei}]
        live: [{type: yahoo, symbol: "^TWII", timezone: Asia/Taipei}]
      - key: KOSPI
        label: South Korea KOSPI
        unit: index
        timezone: Asia/Seoul
        sources: [{type: yahoo, symbol: "^KS11", timezone: Asia/Seoul}]
        live: [{type: yahoo, symbol: "^KS11", timezone: Asia/Seoul}]
  - id: macro
    tab: macro
    title: Rates, Credit & Dollar
    curve: true            # show Treasury curve spreads in the header
    series:
      - key: US2Y
        label: US 2-year Treasury yield
        unit: pct
        sources: [{type: fred, id: DGS2}]
      - key: US5Y
        label: US 5-year Treasury yield
        unit: pct
        sources: [{type: fred, id: DGS5}]
        live: [{type: yahoo, symbol: "^FVX"}]
      - key: US10Y
        label: US 10-year Treasury yield
        unit: pct
        sources: [{type: fred, id: DGS10}]
        live: [{type: yahoo, symbol: "^TNX"}]
      - key: US30Y
        label: US 30-year Treasury yield
        unit: pct
        sources: [{type: fred, id: DGS30}]
        live: [{type: yahoo, symbol: "^TYX"}]
      - key: VXTLT
        label: CBOE 20+ year Treasury bond ETF (TLT) volatility index
        unit: index
        note: "30-day implied volatility of TLT options - the long-end analogue of the VIX; MOVE (Vol complex) covers the whole curve."
        sources: [{type: cboe, name: VXTLT}]
        live: [{type: yahoo, symbol: "^VXTLT"}]
      - key: HYG
        label: iShares iBoxx $ High Yield Corporate Bond ETF
        unit: usd
        sources: [{type: longbridge, symbol: HYG.US}, {type: yahoo, symbol: HYG}]
        live: [{type: longbridge, symbol: HYG.US}, {type: yahoo, symbol: HYG}]
      - key: VPC
        label: Virtus Private Credit Strategy ETF
        unit: usd
        sources: [{type: longbridge, symbol: VPC.US}, {type: yahoo, symbol: VPC}]
        live: [{type: longbridge, symbol: VPC.US}, {type: yahoo, symbol: VPC}]
      - key: BIZD
        label: VanEck BDC Income ETF
        unit: usd
        sources: [{type: longbridge, symbol: BIZD.US}, {type: yahoo, symbol: BIZD}]
        live: [{type: longbridge, symbol: BIZD.US}, {type: yahoo, symbol: BIZD}]
      - key: DXY
        label: ICE US Dollar Index
        unit: index
        sources:
          - {type: yahoo, symbol: DX-Y.NYB, label: "ICE DXY via Yahoo"}
          - {type: fred, id: DTWEXBGS, label: "Fed broad dollar index (fallback, different scale)"}
        live: [{type: yahoo, symbol: DX-Y.NYB}]
    groups:
      # Overlay shown after the HYG mini chart. Both are USD-priced ETFs, so they share one price axis;
      # their monthly distributions are not part of the price lines.
      - id: private_credit
        title: VPC ETF / BIZD ETF
        mode: price_level
        series: [VPC, BIZD]
        after: HYG
        note: "Private-credit and BDC income ETFs on a shared USD price axis; price lines exclude monthly distributions."
  - id: inflation
    tab: macro
    title: Inflation
    daily_only: true
    default_range: 5y
    ranges: [1y, 3y, 5y]
    refresh_seconds: 3600
    groups:
      - id: inflation_yoy
        title: Inflation, year over year
        mode: rate_level
        series: [CPI_YOY, CORE_CPI_YOY, CORE_PCE_YOY, PPI_YOY]
        note: "CPI and PPI from BLS, PCE from BEA, all via FRED. PPI is final demand; core measures exclude food and energy. Monthly observations are published with a lag and are revised."
    series:
      - key: CPI_YOY
        label: CPI YoY
        unit: pct
        sources: [{type: fred, id: CPIAUCSL, transform: yoy, label: "BLS CPI via FRED"}]
      - key: CORE_CPI_YOY
        label: Core CPI YoY
        unit: pct
        sources: [{type: fred, id: CPILFESL, transform: yoy, label: "BLS core CPI via FRED"}]
      - key: CORE_PCE_YOY
        label: Core PCE YoY (Fed's preferred measure)
        unit: pct
        sources: [{type: fred, id: PCEPILFE, transform: yoy, label: "BEA core PCE via FRED"}]
      - key: PPI_YOY
        label: PPI final demand YoY
        unit: pct
        sources: [{type: fred, id: PPIFIS, transform: yoy, label: "BLS PPI via FRED"}]
      - key: STICKY_CORE_YOY
        label: Sticky core services CPI YoY (Atlanta Fed)
        unit: pct
        note: "Sticky Price CPI less Food and Energy, already expressed as a year-over-year percent change."
        sources: [{type: fred, id: CORESTICKM159SFRBATL, label: "Atlanta Fed sticky CPI via FRED"}]
  - id: labor
    tab: macro
    title: Labor Demand
    daily_only: true
    default_range: 3y
    ranges: [6m, 1y, 3y, 5y]
    refresh_seconds: 3600
    groups:
      - id: payroll_change
        title: Monthly payroll change
        mode: level
        unit: k
        y_label: "Change (thousands)"
        series: [ADP_CHG, PAYROLL_CHG]
        note: "ADP National Employment Report (private) versus BLS total nonfarm payrolls. Both are first prints and are revised; the series are not benchmarked to each other."
      - id: claims
        title: Initial jobless claims
        mode: level
        unit: k
        y_label: "Thousands of claims (SA)"
        series: [ICSA_K, IC4WSA_K]
        note: "Weekly and seasonally adjusted. The 4-week average smooths holiday and weather effects; continuing claims are on their own card because the scale differs."
    series:
      - key: ADP_CHG
        label: ADP private payrolls, monthly change (thousands)
        unit: k
        sources: [{type: fred, id: ADPMNUSNERSA, transform: chg, scale: 0.001, label: "ADP via FRED"}]
      - key: PAYROLL_CHG
        label: BLS total nonfarm payrolls, monthly change (thousands)
        unit: k
        sources: [{type: fred, id: PAYEMS, transform: chg, label: "BLS via FRED"}]
      - key: ICSA_K
        label: Initial jobless claims (thousands)
        unit: k
        sources: [{type: fred, id: ICSA, scale: 0.001, label: "DOL via FRED"}]
      - key: IC4WSA_K
        label: Initial claims, 4-week average (thousands)
        unit: k
        sources: [{type: fred, id: IC4WSA, scale: 0.001, label: "DOL via FRED"}]
      - key: CCSA_K
        label: Continuing jobless claims (thousands)
        unit: k
        sources: [{type: fred, id: CCSA, scale: 0.001, label: "DOL via FRED"}]
  - id: pmi
    tab: macro
    title: ISM PMI
    daily_only: true
    default_range: 5y
    ranges: [1y, 3y, 5y]
    refresh_seconds: 3600
    groups:
      - id: ism_levels
        title: ISM Manufacturing vs Services
        mode: level
        unit: index
        y_label: "Diffusion index (50 = neutral)"
        series: [ISM_MFG, ISM_SVC]
        note: "Monthly ISM Report on Business. S&P Global's flash PMI has no free historical feed, so the monthly ISM readings are shown; values above 50 indicate expansion."
    series:
      - key: ISM_MFG
        label: ISM Manufacturing PMI
        unit: index
        sources: [{type: ism, kind: manufacturing, pages: 14, label: "ISM via PR Newswire"}]
      - key: ISM_SVC
        label: ISM Services PMI
        unit: index
        sources: [{type: ism, kind: services, pages: 14, label: "ISM via PR Newswire"}]
  - id: nowcasts
    tab: macro
    title: Nowcasts
    daily_only: true
    default_range: 3y
    ranges: [1y, 3y, 5y]
    refresh_seconds: 1800
    groups:
      - id: cpi_nowcast
        title: Cleveland Fed CPI nowcast vs actual
        mode: rate_level
        series: [CLE_CPI_NOW, CPI_YOY]
        note: "Final nowcast for each month (the last vintage before the BLS release) against realized CPI YoY. The current month is a live nowcast."
      - id: core_pce_nowcast
        title: Cleveland Fed core PCE nowcast vs actual
        mode: rate_level
        series: [CLE_CORE_PCE_NOW, CORE_PCE_YOY]
        note: "Final nowcast before the BEA release against realized core PCE YoY."
    series:
      - key: CLE_CPI_NOW
        label: Cleveland Fed CPI nowcast (YoY)
        unit: pct
        sources: [{type: cleveland_nowcast, kind: cpi_nowcast, label: "Cleveland Fed"}]
      - key: CLE_CORE_PCE_NOW
        label: Cleveland Fed core PCE nowcast (YoY)
        unit: pct
        sources: [{type: cleveland_nowcast, kind: core_pce_nowcast, label: "Cleveland Fed"}]
      - key: GDPNOW
        label: Atlanta Fed GDPNow (quarterly, SAAR)
        unit: pct
        note: "Quarterly nowcast of real GDP growth at an annual rate, updated by the Atlanta Fed as new source data arrive."
        sources: [{type: fred, id: GDPNOW, label: "Atlanta Fed via FRED"}]
      - key: WEI
        label: NY Fed Weekly Economic Index
        unit: pct
        note: "Real activity index scaled to four-quarter GDP growth; weekly and revised."
        sources: [{type: fred, id: WEI, label: "NY Fed via FRED"}]
      - key: CPI_YOY
        label: CPI YoY (actual)
        unit: pct
        sources: [{type: fred, id: CPIAUCSL, transform: yoy, label: "BLS CPI via FRED"}]
      - key: CORE_PCE_YOY
        label: Core PCE YoY (actual)
        unit: pct
        sources: [{type: fred, id: PCEPILFE, transform: yoy, label: "BEA core PCE via FRED"}]
  - id: housing
    tab: macro
    title: Housing
    daily_only: true
    default_range: 5y
    ranges: [1y, 3y, 5y]
    refresh_seconds: 3600
    groups:
      - id: mortgage_rates
        title: Mortgage rates
        mode: rate_level
        y_label: "30Y / 15Y fixed (%)"
        series: [MORTGAGE30, MORTGAGE15]
        note: "Freddie Mac Primary Mortgage Market Survey, weekly. The 30-year fixed is the standard affordability reference; the 15-year usually trades lower."
      - id: price_vs_rent
        title: House price vs rent
        mode: dual_axis
        series: [MEDIAN_PRICE, RENT]
        right_series: [MEDIAN_PRICE]
        left_label: "Rent ($/month)"
        right_label: "Median house price ($)"
        left_unit: usd
        right_unit: usd
        y_label: "Rent (left) and median house price (right)"
        note: "Census median sales price of houses sold (quarterly, right axis) versus the Zillow Observed Rent Index for the United States (monthly, left axis). Different universes, vintages and revision schedules."
    series:
      - key: MORTGAGE30
        label: 30-year fixed mortgage rate
        unit: pct
        sources: [{type: fred, id: MORTGAGE30US, label: "Freddie Mac via FRED"}]
      - key: MORTGAGE15
        label: 15-year fixed mortgage rate
        unit: pct
        sources: [{type: fred, id: MORTGAGE15US, label: "Freddie Mac via FRED"}]
      - key: MEDIAN_PRICE
        label: Median house price
        unit: usd
        sources: [{type: fred, id: MSPUS, label: "Census via FRED"}]
      - key: RENT
        label: National rent (Zillow)
        unit: usd
        sources: [{type: zillow_zori, label: "Zillow ZORI"}]
  - id: consumer
    tab: macro
    title: Consumer
    daily_only: true
    default_range: 1y
    ranges: [6m, 1y, 3y, 5y]
    refresh_seconds: 1800
    groups:
      - id: redbook_sales
        title: Redbook same-store sales
        mode: rate_level
        y_label: "Same-store sales YoY (%)"
        series: [REDBOOK_YOY]
        note: "Johnson Redbook weekly year-over-year same-store sales for large general-merchandise retailers, published Tuesdays. History from TradingView's public economic calendar."
      - id: gasoline
        title: US regular gasoline price
        mode: level
        unit: usd
        y_label: "Dollars per gallon"
        series: [GASOLINE]
        note: "EIA weekly retail price for regular all formulations, Monday survey; national average before taxes."
    series:
      - key: REDBOOK_YOY
        label: Redbook same-store sales YoY
        unit: pct
        sources: [{type: redbook, years: 5, label: "Redbook via TradingView calendar"}]
      - key: GASOLINE
        label: US regular gasoline (per gallon)
        unit: usd
        sources: [{type: fred, id: GASREGW, label: "EIA via FRED"}]
  - id: sentiment
    tab: macro
    title: Sentiment, Breadth & Valuation
    daily_only: true
    default_range: 5y
    ranges: [1y, 3y, 5y]
    refresh_seconds: 3600
    groups:
      - id: rsp_spy
        title: Equal-weight vs cap-weight (RSP/SPY)
        mode: level
        unit: ratio
        y_label: "RSP / SPY ratio"
        series: [RSP_SPY]
        sma: 200
        note: "Total-return ratio of the equal-weight S&P 500 ETF to the cap-weighted ETF, with its 200-day average. Falling means mega-caps are leading; rising means breadth is improving."
      - id: iwm_spy
        title: Small caps vs large caps (IWM/SPY)
        mode: level
        unit: ratio
        y_label: "IWM / SPY ratio"
        series: [IWM_SPY]
        sma: 200
        note: "Total-return ratio of the Russell 2000 ETF to the S&P 500 ETF, with its 200-day average. Small caps usually lead in risk-on phases and lag in defensive ones."
      - id: vix_term
        title: VIX term structure (VIX / VIX3M)
        mode: level
        unit: ratio
        y_label: "VIX / VIX3M"
        series: [VIX_VIX3M]
        levels:
          - {value: 1.0, label: "Inverted - stress"}
        note: "Front-month VIX relative to 3-month VIX. Above 1 the curve is inverted, the cleanest near-term risk-off signal in equity volatility."
      - id: put_call
        title: CBOE put/call ratio (5-day)
        mode: level
        unit: ratio
        y_label: "Put / call"
        series: [PUT_CALL]
        levels:
          - {value: 0.7, label: "Complacency"}
          - {value: 1.0, label: "Fear"}
        note: "CNN Business 5-day put/call ratio across Cboe equity, index and ETP options. Low readings mark complacency, spikes mark capitulation. About one year of history is available from this source."
      - id: aaii
        title: AAII bull-bear spread
        mode: level
        unit: pp
        y_label: "Bullish minus bearish (pp)"
        series: [AAII_SPREAD]
        levels:
          - {value: -10, label: "Pessimism"}
          - {value: 30, label: "Complacency"}
        note: "AAII individual-investor survey, weekly Thursday reading. AAII's free full-history download is bot-protected, so this series starts with the four weeks shown publicly and extends weekly."
      - id: cot
        title: CFTC net non-commercial positioning
        mode: level
        unit: k
        y_label: "Net contracts (000s)"
        series: [COT_SPX, COT_VIX]
        levels:
          - {value: 0, label: "Net flat"}
        note: "CFTC Commitments of Traders, legacy futures-only, Tuesday positions. Net non-commercial length in thousands of contracts; crowded extremes often precede reversals."
      - id: cape
        title: Shiller CAPE
        mode: level
        unit: ratio
        y_label: "Cyclically adjusted P/E (x)"
        series: [CAPE]
        levels:
          - {value: 20, label: "Long-run average"}
          - {value: 30, label: "Elevated"}
          - {value: 40, label: "Extreme"}
        note: "S&P 500 price divided by 10-year average real earnings, monthly from Shiller's data. The long-run average is about 17x; readings above 30x have historically been expensive."
      - id: real_yield
        title: 10-year TIPS real yield
        mode: level
        unit: pct
        y_label: "Real yield (%)"
        series: [TIPS10]
        levels:
          - {value: 0, label: "Zero real yield"}
          - {value: 2, label: "Restrictive"}
        note: "10-year Treasury inflation-protected yield, the real discount rate for equities. Positive real yields tighten conditions and pressure long-duration growth stocks."
      - id: hy_oas
        title: High-yield credit spread (OAS)
        mode: level
        unit: pct
        y_label: "Option-adjusted spread (%)"
        series: [HY_OAS]
        levels:
          - {value: 4, label: "Tight"}
          - {value: 6, label: "Stress"}
          - {value: 8, label: "Crisis"}
        note: "ICE BofA US high-yield option-adjusted spread. Credit stress usually leads equity drawdowns; above 6% is stress, above 8% crisis."
    series:
      - key: RSP_SPY
        label: RSP / SPY
        unit: ratio
        sources:
          - {type: ratio, label: "Yahoo total return",
             numerator: {type: yahoo, symbol: RSP, adjusted: true},
             denominator: {type: yahoo, symbol: SPY, adjusted: true}}
      - key: IWM_SPY
        label: IWM / SPY
        unit: ratio
        sources:
          - {type: ratio, label: "Yahoo total return",
             numerator: {type: yahoo, symbol: IWM, adjusted: true},
             denominator: {type: yahoo, symbol: SPY, adjusted: true}}
      - key: VIX_VIX3M
        label: VIX / VIX3M
        unit: ratio
        sources:
          - {type: ratio, label: "Cboe",
             numerator: {type: cboe, name: VIX},
             denominator: {type: cboe, name: VIX3M}}
      - key: PUT_CALL
        label: 5-day put/call ratio
        unit: ratio
        sources: [{type: cnn_putcall, label: "CNN Fear & Greed"}]
      - key: AAII_SPREAD
        label: AAII bull-bear spread
        unit: pp
        sources: [{type: aaii, label: "AAII"}]
      - key: COT_SPX
        label: E-mini S&P 500 net non-commercial
        unit: k
        sources: [{type: cot, code: 13874A, scale: 0.001, label: "CFTC"}]
      - key: COT_VIX
        label: VIX futures net non-commercial
        unit: k
        sources: [{type: cot, code: 1170E1, scale: 0.001, label: "CFTC"}]
      - key: CAPE
        label: Shiller CAPE
        unit: ratio
        sources: [{type: shiller_cape, label: "Shiller"}]
      - key: TIPS10
        label: 10-year TIPS real yield
        unit: pct
        sources: [{type: fred, id: DFII10, label: "Treasury via FRED"}]
      - key: HY_OAS
        label: US high-yield option-adjusted spread
        unit: pct
        sources: [{type: fred, id: BAMLH0A0HYM2, label: "ICE BofA via FRED"}]
  - id: financial_conditions
    tab: macro
    title: Financial Conditions
    daily_only: true
    default_range: 1y
    ranges: [6m, 1y, 3y, 5y]
    refresh_seconds: 1800
